[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "s112-backend"
version = "0.1.0"
description = "Backend services for the System-112 training simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiokafka==0.14.0",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.20",
    "sqlalchemy[asyncio]==2.0.54",
    "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
test = [
    "aiosqlite==0.22.1",
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/s112"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
