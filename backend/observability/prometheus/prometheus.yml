global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: demo

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres-primary
    static_configs:
      - targets: ["postgres-primary-exporter:9187"]

  - job_name: postgres-replica
    static_configs:
      - targets: ["postgres-replica-exporter:9187"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: nvidia-gpu-exporter
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]
        labels:
          optional: "true"

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://card-api:8080/health
          - http://realtime-gateway:8081/health
          - http://admin-api:8082/health
          - http://speech-api:8083/health
          - http://seaweed-filer-1:8888/healthz
          - http://seaweed-filer-2:8888/healthz
          - http://grafana:3000/api/health
          - http://loki:3100/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
